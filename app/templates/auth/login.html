{% extends "base.html" %}

{% block title %}Login · Portal Acadêmico{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 78vh;">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <span class="avatar-initial" style="width:64px;height:64px;font-size:1.5rem;border-radius:20px;">
                    <i class="fas fa-lock"></i>
                </span>
                <h3 class="fw-bold mt-3 mb-1">Acesso Professor</h3>
                <p class="text-muted small">Entre para gerenciar suas turmas e publicações.</p>
            </div>

            <div class="admin-card p-4">
                <form method="POST">
                    <!-- Token CSRF para segurança (Flask-WTF) -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Senha</label>
                        <input type="password" name="password" class="form-control" required autocomplete="current-password">
                    </div>

                    <div class="mb-3 form-check form-switch">
                        <input type="checkbox" class="form-check-input" name="remember" id="remember">
                        <label class="form-check-label small" for="remember">Lembrar-me neste aparelho</label>
                    </div>

                    <button type="submit" class="btn btn-accent w-100 py-2">Entrar</button>
                </form>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('main.index', ficar=1) }}" class="text-muted text-decoration-none small">&larr; Voltar ao Site</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
