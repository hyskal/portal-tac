{% extends "base.html" %}

{% block title %}Página não encontrada · Portal Acadêmico{% endblock %}

{% block content %}
<div class="container text-center py-5" style="min-height: 70vh; display: flex; flex-direction: column; justify-content: center;">
    <div style="font-size: 4.5rem;">🧭</div>
    <div class="display-5 fw-bold mt-2" style="color: var(--accent);">404</div>
    <h1 class="h5 mb-3 mt-2">Ops! Página não encontrada.</h1>
    <p class="text-muted mb-4">
        O link que você tentou acessar pode ter sido removido ou o endereço está incorreto.
    </p>

    <div>
        <a href="{{ url_for('main.index', ficar=1) }}" class="btn btn-accent px-4">
            <i class="fas fa-home me-1"></i> Voltar ao Início
        </a>
    </div>
</div>
{% endblock %}
